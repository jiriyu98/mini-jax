[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-jax"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.11.2",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = ["absl-py>=2.0.0", "pytest", "ruff"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["minijax"]
